services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: insightflow
      POSTGRES_PASSWORD: insightflow
      POSTGRES_DB: insightflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightflow -d insightflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://insightflow:insightflow@db:5432/insightflow
      STORAGE_DIR: /app/storage
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      MAX_DATASET_ROWS: ${MAX_DATASET_ROWS:-500000}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-800}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      ANOMALY_CONTAMINATION: ${ANOMALY_CONTAMINATION:-0.05}
      ANOMALY_RANDOM_STATE: ${ANOMALY_RANDOM_STATE:-42}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploaded_files:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Server-side API calls inside the Compose network:
      API_BASE_URL: http://backend:8000
      # Browser-facing URL used for direct CSV download links:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./sample_data:/app/sample_data:ro

volumes:
  postgres_data:
  uploaded_files:
